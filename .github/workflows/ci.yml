name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  MIX_ENV: test
  POSTGRES_HOST: localhost
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

jobs:
  test:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.5"

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: _build
          key: build-medlum-${{ runner.os }}-otp29.1.2-elixir1.20.5-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: |
            build-medlum-${{ runner.os }}-otp29.1.2-elixir1.20.5-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

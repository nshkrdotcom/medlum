<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#bfdbfe;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Outer Glow Effect -->
  <circle cx="100" cy="100" r="95" fill="url(#glowGradient)" opacity="0.4"/>

  <!-- Main Circle -->
  <circle cx="100" cy="100" r="80" fill="url(#primaryGradient)"/>

  <!-- Light Rays (8 rays) -->
  <g opacity="0.3">
    <path d="M 100 15 L 100 35 L 98 35 L 98 15 Z" fill="#ffffff"/>
    <path d="M 143.3 31.7 L 135.5 39.5 L 134.1 38.1 L 141.9 30.3 Z" fill="#ffffff"/>
    <path d="M 185 100 L 165 100 L 165 98 L 185 98 Z" fill="#ffffff"/>
    <path d="M 168.3 168.3 L 160.5 160.5 L 161.9 159.1 L 169.7 166.9 Z" fill="#ffffff"/>
    <path d="M 100 185 L 100 165 L 102 165 L 102 185 Z" fill="#ffffff"/>
    <path d="M 31.7 168.3 L 39.5 160.5 L 40.9 161.9 L 33.1 169.7 Z" fill="#ffffff"/>
    <path d="M 15 100 L 35 100 L 35 102 L 15 102 Z" fill="#ffffff"/>
    <path d="M 31.7 31.7 L 39.5 39.5 L 38.1 40.9 L 30.3 33.1 Z" fill="#ffffff"/>
  </g>

  <!-- Stylized "L" with Medical Cross -->
  <g>
    <rect x="70" y="60" width="12" height="70" rx="2" fill="#ffffff"/>
    <rect x="60" y="70" width="32" height="12" rx="2" fill="#ffffff"/>
    <rect x="70" y="118" width="50" height="12" rx="2" fill="#ffffff"/>

    <!-- AI Neural Network Nodes -->
    <circle cx="95" cy="95" r="4" fill="#60a5fa"/>
    <circle cx="110" cy="85" r="4" fill="#60a5fa"/>
    <circle cx="110" cy="105" r="4" fill="#60a5fa"/>

    <!-- Connection lines -->
    <line x1="95" y1="95" x2="110" y2="85" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
    <line x1="95" y1="95" x2="110" y2="105" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
    <line x1="110" y1="85" x2="110" y2="105" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
  </g>

  <circle cx="100" cy="100" r="80" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Enhanced Multi-Stop Gradients -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>

    <!-- Radial gradient for depth -->
    <radialGradient id="depthGradient" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </radialGradient>

    <!-- Enhanced outer glow with multiple stops -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:0.9" />
      <stop offset="40%" style="stop-color:#bfdbfe;stop-opacity:0.6" />
      <stop offset="70%" style="stop-color:#93c5fd;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0" />
    </radialGradient>

    <!-- Metallic shine gradient for L shape -->
    <linearGradient id="metallicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e0e7ff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:0.9" />
    </linearGradient>

    <!-- Neural node gradient (pulsing core) -->
    <radialGradient id="nodeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#93c5fd;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.8" />
    </radialGradient>

    <!-- Connection line gradient (for traveling light effect) -->
    <linearGradient id="lineGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:0.3">
        <animate attributeName="stop-opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0.8">
        <animate attributeName="offset" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:0.3">
        <animate attributeName="stop-opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- SVG Filters for advanced effects -->

    <!-- Outer glow filter (multi-layered) -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur1"/>
      <feOffset in="blur1" dx="0" dy="0" result="offsetBlur1"/>
      <feFlood flood-color="#3b82f6" flood-opacity="0.6"/>
      <feComposite in2="offsetBlur1" operator="in" result="coloredBlur1"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur2"/>
      <feOffset in="blur2" dx="0" dy="0" result="offsetBlur2"/>
      <feFlood flood-color="#60a5fa" flood-opacity="0.8"/>
      <feComposite in2="offsetBlur2" operator="in" result="coloredBlur2"/>

      <feMerge>
        <feMergeNode in="coloredBlur1"/>
        <feMergeNode in="coloredBlur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Depth/shadow filter -->
    <filter id="depth" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="2" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner glow for L shape -->
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="atop" result="glow"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="glow"/>
      </feMerge>
    </filter>

    <!-- Neural node glow (pulsing) -->
    <filter id="nodeGlow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
      <feFlood flood-color="#60a5fa" flood-opacity="0.8">
        <animate attributeName="flood-opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
      </feFlood>
      <feComposite in2="offsetBlur" operator="in" result="coloredBlur"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur2"/>
      <feFlood flood-color="#93c5fd" flood-opacity="0.5">
        <animate attributeName="flood-opacity" values="0.2;0.6;0.2" dur="1.5s" repeatCount="indefinite"/>
      </feFlood>
      <feComposite in2="blur2" operator="in" result="coloredBlur2"/>

      <feMerge>
        <feMergeNode in="coloredBlur2"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Light ray shimmer effect -->
    <filter id="rayGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Specular lighting for metallic effect -->
    <filter id="metallic" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.8" specularExponent="20" lighting-color="#ffffff" result="specOut">
        <fePointLight x="60" y="40" z="100"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceGraphic" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>

  <!-- CSS Animations -->
  <style>
    @keyframes breathe {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.6; }
    }

    @keyframes nodeBreath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .outer-glow {
      animation: breathe 4s ease-in-out infinite;
      transform-origin: center;
    }

    .light-rays {
      animation: rotate 30s linear infinite;
      transform-origin: center;
    }

    .ray-element {
      animation: shimmer 3s ease-in-out infinite;
    }

    .neural-node {
      animation: nodeBreath 1.5s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Outer Glow Effect (Enhanced with breathing animation) -->
  <circle cx="100" cy="100" r="95" fill="url(#glowGradient)" class="outer-glow"/>

  <!-- Additional ambient glow layers -->
  <circle cx="100" cy="100" r="90" fill="url(#glowGradient)" opacity="0.2" filter="url(#outerGlow)">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Main Circle with enhanced depth -->
  <circle cx="100" cy="100" r="80" fill="url(#depthGradient)" filter="url(#outerGlow)"/>

  <!-- Crystalline overlay for depth -->
  <circle cx="100" cy="100" r="80" fill="url(#primaryGradient)" opacity="0.8"/>

  <!-- Subtle inner ring for dimension -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="url(#primaryGradient)" stroke-width="0.5" opacity="0.6"/>

  <!-- Light Rays (8 rays) with shimmer and rotation -->
  <g opacity="0.3" class="light-rays">
    <g class="ray-element" style="animation-delay: 0s;">
      <path d="M 100 15 L 100 35 L 98 35 L 98 15 Z" fill="#ffffff" filter="url(#rayGlow)"/>
    </g>
    <g class="ray-element" style="animation-delay: 0.375s;">
      <path d="M 143.3 31.7 L 135.5 39.5 L 134.1 38.1 L 141.9 30.3 Z" fill="#ffffff" filter="url(#rayGlow)"/>
    </g>
    <g class="ray-element" style="animation-delay: 0.75s;">
      <path d="M 185 100 L 165 100 L 165 98 L 185 98 Z" fill="#ffffff" filter="url(#rayGlow)"/>
    </g>
    <g class="ray-element" style="animation-delay: 1.125s;">
      <path d="M 168.3 168.3 L 160.5 160.5 L 161.9 159.1 L 169.7 166.9 Z" fill="#ffffff" filter="url(#rayGlow)"/>
    </g>
    <g class="ray-element" style="animation-delay: 1.5s;">
      <path d="M 100 185 L 100 165 L 102 165 L 102 185 Z" fill="#ffffff" filter="url(#rayGlow)"/>
    </g>
    <g class="ray-element" style="animation-delay: 1.875s;">
      <path d="M 31.7 168.3 L 39.5 160.5 L 40.9 161.9 L 33.1 169.7 Z" fill="#ffffff" filter="url(#rayGlow)"/>
    </g>
    <g class="ray-element" style="animation-delay: 2.25s;">
      <path d="M 15 100 L 35 100 L 35 102 L 15 102 Z" fill="#ffffff" filter="url(#rayGlow)"/>
    </g>
    <g class="ray-element" style="animation-delay: 2.625s;">
      <path d="M 31.7 31.7 L 39.5 39.5 L 38.1 40.9 L 30.3 33.1 Z" fill="#ffffff" filter="url(#rayGlow)"/>
    </g>
  </g>

  <!-- Stylized "L" with Medical Cross (Enhanced with metallic effect) -->
  <g filter="url(#metallic)">
    <!-- Depth shadows for 3D effect -->
    <rect x="72" y="62" width="12" height="70" rx="2" fill="#000000" opacity="0.2"/>
    <rect x="62" y="72" width="32" height="12" rx="2" fill="#000000" opacity="0.2"/>
    <rect x="72" y="120" width="50" height="12" rx="2" fill="#000000" opacity="0.2"/>

    <!-- Main L shape with metallic gradient -->
    <rect x="70" y="60" width="12" height="70" rx="2" fill="url(#metallicGradient)" filter="url(#innerGlow)"/>
    <rect x="60" y="70" width="32" height="12" rx="2" fill="url(#metallicGradient)" filter="url(#innerGlow)"/>
    <rect x="70" y="118" width="50" height="12" rx="2" fill="url(#metallicGradient)" filter="url(#innerGlow)"/>

    <!-- Highlight edges for metallic shine -->
    <rect x="70" y="60" width="12" height="2" rx="1" fill="#ffffff" opacity="0.6"/>
    <rect x="60" y="70" width="2" height="12" rx="1" fill="#ffffff" opacity="0.6"/>
    <rect x="70" y="118" width="2" height="12" rx="1" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- AI Neural Network Nodes (Enhanced with pulsing glow) -->
  <g>
    <!-- Connection lines with traveling light effect -->
    <line x1="95" y1="95" x2="110" y2="85" stroke="url(#lineGradient1)" stroke-width="2" opacity="0.8"/>
    <line x1="95" y1="95" x2="110" y2="105" stroke="url(#lineGradient1)" stroke-width="2" opacity="0.8" style="animation-delay: 0.66s;"/>
    <line x1="110" y1="85" x2="110" y2="105" stroke="url(#lineGradient1)" stroke-width="2" opacity="0.8" style="animation-delay: 1.33s;"/>

    <!-- Additional glow lines underneath -->
    <line x1="95" y1="95" x2="110" y2="85" stroke="#60a5fa" stroke-width="4" opacity="0.3" filter="url(#outerGlow)">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="95" y1="95" x2="110" y2="105" stroke="#60a5fa" stroke-width="4" opacity="0.3" filter="url(#outerGlow)">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite" begin="0.66s"/>
    </line>
    <line x1="110" y1="85" x2="110" y2="105" stroke="#60a5fa" stroke-width="4" opacity="0.3" filter="url(#outerGlow)">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite" begin="1.33s"/>
    </line>

    <!-- Neural nodes with enhanced glow and pulsing -->
    <g class="neural-node">
      <circle cx="95" cy="95" r="6" fill="#60a5fa" opacity="0.3" filter="url(#nodeGlow)"/>
      <circle cx="95" cy="95" r="4" fill="url(#nodeGradient)" filter="url(#nodeGlow)"/>
      <circle cx="95" cy="95" r="2" fill="#ffffff" opacity="0.9"/>
    </g>

    <g class="neural-node" style="animation-delay: 0.5s;">
      <circle cx="110" cy="85" r="6" fill="#60a5fa" opacity="0.3" filter="url(#nodeGlow)"/>
      <circle cx="110" cy="85" r="4" fill="url(#nodeGradient)" filter="url(#nodeGlow)"/>
      <circle cx="110" cy="85" r="2" fill="#ffffff" opacity="0.9"/>
    </g>

    <g class="neural-node" style="animation-delay: 1s;">
      <circle cx="110" cy="105" r="6" fill="#60a5fa" opacity="0.3" filter="url(#nodeGlow)"/>
      <circle cx="110" cy="105" r="4" fill="url(#nodeGradient)" filter="url(#nodeGlow)"/>
      <circle cx="110" cy="105" r="2" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- Outer border ring with shimmer -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.3" filter="url(#outerGlow)"/>

  <!-- Additional crystalline ring effect -->
  <circle cx="100" cy="100" r="81" fill="none" stroke="url(#primaryGradient)" stroke-width="0.5" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Particle shimmer effects (subtle floating particles) -->
  <g opacity="0.6">
    <circle cx="130" cy="70" r="1" fill="#93c5fd">
      <animate attributeName="cy" values="70;65;70" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="95" r="0.8" fill="#bfdbfe">
      <animate attributeName="cy" values="95;90;95" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="125" cy="120" r="1.2" fill="#60a5fa">
      <animate attributeName="cy" values="120;115;120" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="140" r="0.9" fill="#93c5fd">
      <animate attributeName="cx" values="140;145;140" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

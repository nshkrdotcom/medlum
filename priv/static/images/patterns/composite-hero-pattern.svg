<!-- Composite Hero Pattern - Premium Login Background
     Combines neural networks, data flow, and medical precision
     Use as: Full-screen hero background for login/landing page
     Tileable: Yes
     Theme: Complete Traceable AI Intelligence visualization
-->
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"/>
    </linearGradient>

    <!-- Neural connection gradient -->
    <linearGradient id="connectionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0"/>
    </linearGradient>

    <!-- Radial glow for focal points -->
    <radialGradient id="focalGlow">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0"/>
    </radialGradient>

    <!-- Data flow gradient -->
    <linearGradient id="dataFlow">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0">
        <animate attributeName="stop-opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0">
        <animate attributeName="stop-opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0">
        <animate attributeName="stop-opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Hexagon for medical precision elements -->
    <polygon id="miniHex"
             points="10,0 18.66,5 18.66,15 10,20 1.34,15 1.34,5"
             stroke="#3b82f6"
             stroke-width="0.5"
             fill="none"
             opacity="0.2"/>
  </defs>

  <!-- Base gradient background -->
  <rect width="1200" height="800" fill="url(#heroGradient)"/>

  <!-- Subtle grid structure -->
  <g id="backgroundGrid" opacity="0.05">
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="800" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="800" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="800" stroke="#3b82f6" stroke-width="0.5"/>
  </g>

  <!-- Large neural network (left side) -->
  <g id="neuralNetworkLeft" opacity="0.3">
    <!-- Main trunk -->
    <path d="M 50 400 Q 150 400 250 300" stroke="url(#connectionGrad)" stroke-width="2" fill="none"/>
    <path d="M 50 400 Q 150 400 250 500" stroke="url(#connectionGrad)" stroke-width="2" fill="none"/>

    <!-- Upper branch -->
    <path d="M 250 300 L 350 200" stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 250 300 L 350 350" stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Lower branch -->
    <path d="M 250 500 L 350 450" stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 250 500 L 350 600" stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Terminal branches -->
    <path d="M 350 200 L 450 150" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 350 200 L 450 250" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 350 600 L 450 550" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 350 600 L 450 650" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- Decision nodes -->
    <circle cx="50" cy="400" r="5" fill="#8b5cf6" opacity="0.7">
      <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="300" r="4" fill="#6366f1" opacity="0.6">
      <animate attributeName="r" values="4;6;4" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="500" r="4" fill="#6366f1" opacity="0.6">
      <animate attributeName="r" values="4;6;4" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="200" r="3" fill="#3b82f6" opacity="0.5"/>
    <circle cx="350" cy="350" r="3" fill="#3b82f6" opacity="0.5"/>
    <circle cx="350" cy="450" r="3" fill="#3b82f6" opacity="0.5"/>
    <circle cx="350" cy="600" r="3" fill="#3b82f6" opacity="0.5"/>

    <!-- Data flow animation -->
    <path d="M 50 400 Q 150 400 250 300 L 350 200 L 450 150"
          stroke="url(#dataFlow)"
          stroke-width="2.5"
          fill="none"
          opacity="0.8"/>
  </g>

  <!-- Central hexagonal medical grid -->
  <g id="centralHexGrid" transform="translate(500, 300)" opacity="0.2">
    <!-- Hexagon cluster -->
    <use href="#miniHex" x="0" y="0"/>
    <use href="#miniHex" x="20" y="0"/>
    <use href="#miniHex" x="40" y="0"/>
    <use href="#miniHex" x="10" y="17"/>
    <use href="#miniHex" x="30" y="17"/>
    <use href="#miniHex" x="50" y="17"/>
    <use href="#miniHex" x="0" y="34"/>
    <use href="#miniHex" x="20" y="34"/>
    <use href="#miniHex" x="40" y="34"/>

    <!-- Molecular centers -->
    <circle cx="10" cy="10" r="2" fill="#60a5fa" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="10" r="2" fill="#3b82f6" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="10" r="2" fill="#60a5fa" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Right side data visualization elements -->
  <g id="dataVizRight" transform="translate(750, 0)" opacity="0.25">
    <!-- Confidence interval curve -->
    <path d="M 50 300 Q 150 250 250 280 T 450 300"
          stroke="#60a5fa"
          stroke-width="1"
          fill="none"
          stroke-dasharray="3,3"
          opacity="0.5"/>

    <path d="M 50 320 Q 150 270 250 300 T 450 320"
          stroke="#3b82f6"
          stroke-width="2"
          fill="none">
      <animate attributeName="stroke-dasharray" values="0,800;800,0" dur="5s" repeatCount="indefinite"/>
    </path>

    <path d="M 50 340 Q 150 290 250 320 T 450 340"
          stroke="#60a5fa"
          stroke-width="1"
          fill="none"
          stroke-dasharray="3,3"
          opacity="0.5"/>

    <!-- Data points on curve -->
    <circle cx="50" cy="320" r="3" fill="#60a5fa" opacity="0.6">
      <animate attributeName="r" values="3;4.5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="270" r="3" fill="#3b82f6" opacity="0.6">
      <animate attributeName="r" values="3;4.5;3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="300" r="3" fill="#60a5fa" opacity="0.6">
      <animate attributeName="r" values="3;4.5;3" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="310" r="3" fill="#3b82f6" opacity="0.6">
      <animate attributeName="r" values="3;4.5;3" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Mini bar chart elements -->
    <rect x="80" y="500" width="15" height="60" fill="#6366f1" opacity="0.4" rx="2"/>
    <rect x="100" y="480" width="15" height="80" fill="#3b82f6" opacity="0.4" rx="2"/>
    <rect x="120" y="510" width="15" height="50" fill="#60a5fa" opacity="0.4" rx="2"/>
    <rect x="140" y="490" width="15" height="70" fill="#6366f1" opacity="0.4" rx="2"/>
  </g>

  <!-- Floating particles/nodes throughout -->
  <g id="floatingParticles" opacity="0.15">
    <circle cx="200" cy="150" r="2" fill="#60a5fa">
      <animate attributeName="cy" values="150;140;150" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="100" r="2.5" fill="#3b82f6">
      <animate attributeName="cy" values="100;90;100" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="700" r="2" fill="#6366f1">
      <animate attributeName="cy" values="700;710;700" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="200" r="2.5" fill="#60a5fa">
      <animate attributeName="cy" values="200;190;200" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="650" r="2" fill="#3b82f6">
      <animate attributeName="cy" values="650;660;650" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Central focal point glow (where login form would be) -->
  <g id="centralFocus" transform="translate(600, 400)" opacity="0.1">
    <circle cx="0" cy="0" r="150" fill="url(#focalGlow)">
      <animate attributeName="r" values="150;180;150" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtle scan lines for tech feel -->
  <g id="scanLines" opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#60a5fa" stroke-width="1">
      <animate attributeName="y1" values="0;800;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;800;0" dur="10s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Corner accent elements -->
  <g id="cornerAccents" opacity="0.15">
    <!-- Top left -->
    <path d="M 0 0 L 100 0 L 100 2 L 2 2 L 2 100 L 0 100 Z" fill="#3b82f6"/>

    <!-- Top right -->
    <path d="M 1200 0 L 1100 0 L 1100 2 L 1198 2 L 1198 100 L 1200 100 Z" fill="#6366f1"/>

    <!-- Bottom right -->
    <path d="M 1200 800 L 1100 800 L 1100 798 L 1198 798 L 1198 700 L 1200 700 Z" fill="#3b82f6"/>

    <!-- Bottom left -->
    <path d="M 0 800 L 100 800 L 100 798 L 2 798 L 2 700 L 0 700 Z" fill="#6366f1"/>
  </g>

  <!-- Subtle coordinate system in corners -->
  <g id="coordinates" opacity="0.08">
    <text x="10" y="20" font-family="monospace" font-size="10" fill="#60a5fa">0,0</text>
    <text x="1140" y="20" font-family="monospace" font-size="10" fill="#60a5fa">1200,0</text>
    <text x="10" y="790" font-family="monospace" font-size="10" fill="#60a5fa">0,800</text>
    <text x="1115" y="790" font-family="monospace" font-size="10" fill="#60a5fa">1200,800</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="iconGlow3">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Center node -->
  <circle cx="24" cy="24" r="5"
          fill="url(#iconGrad3)"
          filter="url(#iconGlow3)"/>

  <!-- Connection lines -->
  <line x1="24" y1="24" x2="12" y2="12" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <line x1="24" y1="24" x2="36" y2="12" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <line x1="24" y1="24" x2="12" y2="36" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  <line x1="24" y1="24" x2="36" y2="36" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  <line x1="24" y1="24" x2="6" y2="24" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  <line x1="24" y1="24" x2="42" y2="24" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>

  <!-- Outer nodes -->
  <circle cx="12" cy="12" r="3.5" fill="url(#iconGrad3)" opacity="0.9"/>
  <circle cx="36" cy="12" r="3.5" fill="url(#iconGrad3)" opacity="0.9"/>
  <circle cx="12" cy="36" r="3.5" fill="url(#iconGrad3)" opacity="0.9"/>
  <circle cx="36" cy="36" r="3.5" fill="url(#iconGrad3)" opacity="0.9"/>
  <circle cx="6" cy="24" r="3" fill="#60a5fa" opacity="0.8"/>
  <circle cx="42" cy="24" r="3" fill="#60a5fa" opacity="0.8"/>

  <!-- Pulse effect on center -->
  <circle cx="24" cy="24" r="5"
          fill="none"
          stroke="#60a5fa"
          stroke-width="1"
          opacity="0.4">
    <animate attributeName="r" from="5" to="12" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.4" to="0" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>

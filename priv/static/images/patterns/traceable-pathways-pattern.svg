<!-- Traceable Pathways Pattern - Decision Tree Visualization
     Abstract representation of AI decision trees with flowing, branching lines
     Use as: background-image: url('...traceable-pathways-pattern.svg')
     Tileable: Yes
     Theme: Transparent AI decision-making and traceable logic flows
-->
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for main pathways -->
    <linearGradient id="pathwayGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
    </linearGradient>

    <linearGradient id="pathwayGradient2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
    </linearGradient>

    <!-- Glow gradient for decision points -->
    <radialGradient id="decisionGlow">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0"/>
    </radialGradient>

    <!-- Flow animation gradient -->
    <linearGradient id="flowGradient">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0.8">
        <animate attributeName="offset" values="0;0.5;1" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#0f172a" opacity="0.01"/>

  <!-- Main decision tree structure - Left pathway -->
  <g id="leftTree" opacity="0.4">
    <!-- Trunk -->
    <path d="M 50 200 Q 100 200 150 150"
          stroke="url(#pathwayGradient1)"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"/>
    <path d="M 50 200 Q 100 200 150 250"
          stroke="url(#pathwayGradient1)"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"/>

    <!-- Upper branches -->
    <path d="M 150 150 Q 200 150 250 100"
          stroke="url(#pathwayGradient2)"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"/>
    <path d="M 150 150 Q 200 150 250 180"
          stroke="url(#pathwayGradient2)"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"/>

    <!-- Lower branches -->
    <path d="M 150 250 Q 200 250 250 220"
          stroke="url(#pathwayGradient2)"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"/>
    <path d="M 150 250 Q 200 250 250 300"
          stroke="url(#pathwayGradient2)"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"/>

    <!-- Terminal branches -->
    <path d="M 250 100 L 320 70"
          stroke="#6366f1"
          stroke-width="1"
          fill="none"
          stroke-linecap="round"
          opacity="0.5"/>
    <path d="M 250 100 L 320 130"
          stroke="#6366f1"
          stroke-width="1"
          fill="none"
          stroke-linecap="round"
          opacity="0.5"/>
    <path d="M 250 180 L 320 160"
          stroke="#6366f1"
          stroke-width="1"
          fill="none"
          stroke-linecap="round"
          opacity="0.5"/>
    <path d="M 250 180 L 320 200"
          stroke="#6366f1"
          stroke-width="1"
          fill="none"
          stroke-linecap="round"
          opacity="0.5"/>
    <path d="M 250 220 L 320 200"
          stroke="#6366f1"
          stroke-width="1"
          fill="none"
          stroke-linecap="round"
          opacity="0.5"/>
    <path d="M 250 220 L 320 240"
          stroke="#6366f1"
          stroke-width="1"
          fill="none"
          stroke-linecap="round"
          opacity="0.5"/>
    <path d="M 250 300 L 320 270"
          stroke="#6366f1"
          stroke-width="1"
          fill="none"
          stroke-linecap="round"
          opacity="0.5"/>
    <path d="M 250 300 L 320 330"
          stroke="#6366f1"
          stroke-width="1"
          fill="none"
          stroke-linecap="round"
          opacity="0.5"/>
  </g>

  <!-- Right pathway (mirrored for tiling) -->
  <g id="rightTree" opacity="0.4">
    <!-- Trunk -->
    <path d="M 550 200 Q 500 200 450 150"
          stroke="url(#pathwayGradient1)"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"/>
    <path d="M 550 200 Q 500 200 450 250"
          stroke="url(#pathwayGradient1)"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"/>

    <!-- Upper branches -->
    <path d="M 450 150 Q 400 150 350 100"
          stroke="url(#pathwayGradient2)"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"/>
    <path d="M 450 150 Q 400 150 350 180"
          stroke="url(#pathwayGradient2)"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"/>

    <!-- Lower branches -->
    <path d="M 450 250 Q 400 250 350 220"
          stroke="url(#pathwayGradient2)"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"/>
    <path d="M 450 250 Q 400 250 350 300"
          stroke="url(#pathwayGradient2)"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"/>
  </g>

  <!-- Animated flow paths (data flowing through decision tree) -->
  <g id="flowAnimation">
    <!-- Flow 1: Upper path -->
    <path d="M 50 200 Q 100 200 150 150 Q 200 150 250 100 L 320 70"
          stroke="url(#flowGradient)"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"
          opacity="0.6">
      <animate attributeName="stroke-dasharray"
               values="0,1000;1000,0"
               dur="5s"
               repeatCount="indefinite"/>
    </path>

    <!-- Flow 2: Middle path -->
    <path d="M 50 200 Q 100 200 150 150 Q 200 150 250 180 L 320 200"
          stroke="url(#flowGradient)"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"
          opacity="0.6">
      <animate attributeName="stroke-dasharray"
               values="0,1000;1000,0"
               dur="5s"
               begin="1s"
               repeatCount="indefinite"/>
    </path>

    <!-- Flow 3: Lower path -->
    <path d="M 50 200 Q 100 200 150 250 Q 200 250 250 300 L 320 330"
          stroke="url(#flowGradient)"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"
          opacity="0.6">
      <animate attributeName="stroke-dasharray"
               values="0,1000;1000,0"
               dur="5s"
               begin="2s"
               repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Decision points (nodes where decisions are made) -->
  <g id="decisionPoints">
    <!-- Entry point -->
    <circle cx="50" cy="200" r="4" fill="#8b5cf6" opacity="0.6">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- First level decisions -->
    <circle cx="150" cy="150" r="3.5" fill="#6366f1" opacity="0.5">
      <animate attributeName="r" values="3.5;5;3.5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="250" r="3.5" fill="#6366f1" opacity="0.5">
      <animate attributeName="r" values="3.5;5;3.5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Second level decisions -->
    <circle cx="250" cy="100" r="3" fill="#3b82f6" opacity="0.4">
      <animate attributeName="r" values="3;4.5;3" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="180" r="3" fill="#3b82f6" opacity="0.4">
      <animate attributeName="r" values="3;4.5;3" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="220" r="3" fill="#3b82f6" opacity="0.4">
      <animate attributeName="r" values="3;4.5;3" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="300" r="3" fill="#3b82f6" opacity="0.4">
      <animate attributeName="r" values="3;4.5;3" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>

    <!-- Terminal outcomes -->
    <circle cx="320" cy="70" r="2.5" fill="#60a5fa" opacity="0.3"/>
    <circle cx="320" cy="130" r="2.5" fill="#60a5fa" opacity="0.3"/>
    <circle cx="320" cy="160" r="2.5" fill="#60a5fa" opacity="0.3"/>
    <circle cx="320" cy="200" r="2.5" fill="#60a5fa" opacity="0.3"/>
    <circle cx="320" cy="240" r="2.5" fill="#60a5fa" opacity="0.3"/>
    <circle cx="320" cy="270" r="2.5" fill="#60a5fa" opacity="0.3"/>
    <circle cx="320" cy="330" r="2.5" fill="#60a5fa" opacity="0.3"/>

    <!-- Right tree decision points -->
    <circle cx="550" cy="200" r="4" fill="#8b5cf6" opacity="0.6">
      <animate attributeName="r" values="4;6;4" dur="2s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="150" r="3.5" fill="#6366f1" opacity="0.5"/>
    <circle cx="450" cy="250" r="3.5" fill="#6366f1" opacity="0.5"/>
    <circle cx="350" cy="100" r="3" fill="#3b82f6" opacity="0.4"/>
    <circle cx="350" cy="180" r="3" fill="#3b82f6" opacity="0.4"/>
    <circle cx="350" cy="220" r="3" fill="#3b82f6" opacity="0.4"/>
    <circle cx="350" cy="300" r="3" fill="#3b82f6" opacity="0.4"/>
  </g>

  <!-- Subtle glow effects at key decision points -->
  <g id="decisionGlows" opacity="0.15">
    <circle cx="50" cy="200" r="15" fill="url(#decisionGlow)">
      <animate attributeName="r" values="15;20;15" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="150" r="12" fill="url(#decisionGlow)">
      <animate attributeName="r" values="12;18;12" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="250" r="12" fill="url(#decisionGlow)">
      <animate attributeName="r" values="12;18;12" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtle connecting mesh for depth -->
  <g id="depthMesh" opacity="0.08">
    <line x1="150" y1="150" x2="150" y2="250" stroke="#6366f1" stroke-width="0.5" stroke-dasharray="5,5"/>
    <line x1="250" y1="100" x2="250" y2="300" stroke="#3b82f6" stroke-width="0.5" stroke-dasharray="5,5"/>
    <line x1="450" y1="150" x2="450" y2="250" stroke="#6366f1" stroke-width="0.5" stroke-dasharray="5,5"/>
  </g>
</svg>

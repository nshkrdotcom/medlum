<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:0.3" />
    </radialGradient>

    <linearGradient id="pathGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0.3" />
    </linearGradient>

    <linearGradient id="pathGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0.3" />
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Decision path network -->
  <path d="M 32 32 Q 42 22, 48 19" stroke="url(#pathGradient1)" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <circle cx="48" cy="19" r="2.5" fill="#60A5FA" opacity="0.7" filter="url(#softGlow)"/>

  <path d="M 32 32 Q 42 32, 50 30" stroke="url(#pathGradient1)" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
  <circle cx="50" cy="30" r="3" fill="#3B82F6" opacity="0.8" filter="url(#softGlow)"/>

  <path d="M 32 32 Q 40 40, 46 46" stroke="url(#pathGradient1)" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <circle cx="46" cy="46" r="2.5" fill="#60A5FA" opacity="0.7" filter="url(#softGlow)"/>

  <path d="M 32 32 L 32 48" stroke="url(#pathGradient2)" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round"/>
  <circle cx="32" cy="48" r="2.5" fill="#8B5CF6" opacity="0.8" filter="url(#softGlow)"/>

  <path d="M 32 32 Q 24 40, 18 46" stroke="url(#pathGradient2)" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <circle cx="18" cy="46" r="2.5" fill="#8B5CF6" opacity="0.7" filter="url(#softGlow)"/>

  <path d="M 32 32 Q 22 32, 14 30" stroke="url(#pathGradient2)" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
  <circle cx="14" cy="30" r="3" fill="#8B5CF6" opacity="0.8" filter="url(#softGlow)"/>

  <path d="M 32 32 Q 22 22, 16 19" stroke="url(#pathGradient2)" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <circle cx="16" cy="19" r="2.5" fill="#8B5CF6" opacity="0.7" filter="url(#softGlow)"/>

  <path d="M 32 32 L 32 16" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round"/>
  <circle cx="32" cy="16" r="3" fill="#3B82F6" opacity="0.9" filter="url(#softGlow)"/>

  <!-- Mid-level nodes -->
  <circle cx="42" cy="26" r="2" fill="#60A5FA" opacity="0.6"/>
  <circle cx="40" cy="35" r="2" fill="#60A5FA" opacity="0.6"/>
  <circle cx="24" cy="35" r="2" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="22" cy="26" r="2" fill="#8B5CF6" opacity="0.6"/>

  <!-- Connection lines -->
  <line x1="32" y1="32" x2="42" y2="26" stroke="#60A5FA" stroke-width="0.8" opacity="0.3"/>
  <line x1="32" y1="32" x2="40" y2="35" stroke="#60A5FA" stroke-width="0.8" opacity="0.3"/>
  <line x1="32" y1="32" x2="24" y2="35" stroke="#8B5CF6" stroke-width="0.8" opacity="0.3"/>
  <line x1="32" y1="32" x2="22" y2="26" stroke="#8B5CF6" stroke-width="0.8" opacity="0.3"/>

  <!-- Inner ring -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.4" stroke-dasharray="2,2"/>

  <!-- Core intelligence node -->
  <circle cx="32" cy="32" r="6" fill="url(#coreGlow)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="4" fill="#1E40AF" opacity="0.9"/>
  <ellipse cx="30" cy="30" rx="2" ry="1.5" fill="#60A5FA" opacity="0.4"/>

  <!-- Central data symbol -->
  <g opacity="0.9">
    <path d="M 30 32 L 32 30 L 34 32 L 32 34 Z" fill="#E0F2FE" stroke="#BFDBFE" stroke-width="0.3"/>
    <circle cx="32" cy="32" r="0.8" fill="#FFFFFF"/>
  </g>
</svg>
